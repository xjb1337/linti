name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      notes:
        description: '发布说明（可选）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linti-release
  cancel-in-progress: false

env:
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Release 只能从已推送的 v* tag 触发；当前 ref 为 $GITHUB_REF。请在 vX.Y.Z tag 上重新运行。"
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tag 必须形如 vX.Y.Z，当前为 $TAG"
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          SOURCE_VERSION_NAME="$(sed -nE 's/^val appVersionName = .*\?: "([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -nE 's/^val appVersionCode = .*\?: ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts)"
          if [[ "$SOURCE_VERSION_NAME" != "$VERSION_NAME" || ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::请在 app/build.gradle.kts 中设置与 $TAG 一致的版本名和有效的版本号。"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG (versionName=$VERSION_NAME, versionCode=$VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          export ANDROID_HOME ANDROID_SDK_ROOT
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          } >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::未找到 sdkmanager；请确认 runner 的 Android SDK 包含 cmdline-tools"
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

  release:
    name: Build signed release and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION_NAME: ${{ needs.verify.outputs.version_name }}
      VERSION_CODE: ${{ needs.verify.outputs.version_code }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          export ANDROID_HOME ANDROID_SDK_ROOT
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          } >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::未找到 sdkmanager；请确认 runner 的 Android SDK 包含 cmdline-tools"
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::缺少 GitHub Secret: $secret_name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_FILE:-}"
          ./gradlew assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            --no-daemon --stacktrace

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify APK signature, metadata, and checksum
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          if [[ ! -x "$AAPT" ]]; then
            AAPT="$BUILD_TOOLS/aapt2"
          fi
          test -f "$APK"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          mkdir -p dist
          ASSET="dist/linti-${VERSION_NAME}.apk"
          cp "$APK" "$ASSET"

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$ASSET")"
          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' \
              | head -n 1 \
              | tr -d '[:space:]:' \
              | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED_CERT_NORMALIZED="$(
            printf '%s' "$EXPECTED_CERT_SHA256" \
              | tr -d '[:space:]:' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [[ ! "$EXPECTED_CERT_NORMALIZED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::EXPECTED_CERT_SHA256 不是有效的 SHA-256 十六进制指纹"
            exit 1
          fi
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_NORMALIZED" ]]; then
            echo "::error::APK 签名证书 SHA-256 与 EXPECTED_CERT_SHA256 不一致"
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$ASSET")"
          ACTUAL_PACKAGE="$(
            printf '%s\n' "$BADGING" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"
          ACTUAL_VERSION_CODE="$(
            printf '%s\n' "$BADGING" \
              | sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"
          ACTUAL_VERSION_NAME="$(
            printf '%s\n' "$BADGING" \
              | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"
          printf 'package=%s versionName=%s versionCode=%s\n' \
            "$ACTUAL_PACKAGE" "$ACTUAL_VERSION_NAME" "$ACTUAL_VERSION_CODE"
          test "$ACTUAL_PACKAGE" = "com.xjb.linti"
          test "$ACTUAL_VERSION_NAME" = "$VERSION_NAME"
          test "$ACTUAL_VERSION_CODE" = "$VERSION_CODE"

          (
            cd dist
            sha256sum "linti-${VERSION_NAME}.apk" > "linti-${VERSION_NAME}.apk.sha256"
            sha256sum --check "linti-${VERSION_NAME}.apk.sha256"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          ASSET="dist/linti-${VERSION_NAME}.apk"
          CHECKSUM="dist/linti-${VERSION_NAME}.apk.sha256"
          test -f "$ASSET"
          test -f "$CHECKSUM"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，拒绝覆盖"
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [[ -n "${RELEASE_NOTES:-}" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"
          elif [[ -f "docs/releases/$TAG.md" ]]; then
            cp "docs/releases/$TAG.md" "$NOTES_FILE"
          else
            cat > "$NOTES_FILE" <<EOF
          临题 ${VERSION_NAME} 正式签名版本。

          全功能免费、本地优先。
          EOF
          fi

          gh release create "$TAG" "$ASSET" "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            --latest \
            --draft=false \
            --prerelease=false
